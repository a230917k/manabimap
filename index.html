<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まなびマップ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--surface:#FFF;--surface2:#F0EDE6;--border:#E2DDD4;
  --text:#1A1714;--text2:#6B6560;--text3:#9B948C;
  --accent:#2C5F2E;--accent-l:#EAF3DE;
  --warn:#A85A00;--warn-l:#FEF3E2;
  --danger:#8B1A1A;--danger-l:#FDECEC;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.logo{font-size:19px;font-weight:700;color:var(--accent)}.logo span{color:var(--text)}
.logo-sub{font-size:11px;color:var(--text3);margin-left:6px}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;padding:0 20px;position:sticky;top:56px;z-index:100}
.tab{padding:12px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;transition:all .15s}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.page{display:none;padding:20px;max-width:680px;margin:0 auto}.page.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:6px;font-weight:500}
.opt{color:var(--text3);font-weight:400;margin-left:4px}
textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:15px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg);resize:vertical;min-height:130px;line-height:1.7;transition:border-color .15s}
textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.grade-row{display:flex;gap:6px;flex-wrap:wrap}
.gbtn{padding:6px 14px;font-size:12px;font-family:'Noto Sans JP',sans-serif;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s}
.gbtn.sel{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary{width:100%;padding:14px 20px;background:var(--text);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s;margin-top:12px}
.btn-primary:hover{opacity:.88}.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.user-row{display:flex;gap:8px;flex-wrap:wrap}
.user-chip{padding:5px 12px;font-size:12px;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--surface);color:var(--text2);display:flex;align-items:center;gap:6px;font-family:'Noto Sans JP',sans-serif;transition:all .15s}
.user-chip.sel{background:var(--text);color:#fff;border-color:var(--text)}
.avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.add-btn{padding:5px 12px;font-size:12px;border:1px dashed var(--border);border-radius:20px;cursor:pointer;background:none;color:var(--text2);font-family:'Noto Sans JP',sans-serif}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;display:inline-block}
.t-ko{background:#E6F1FB;color:#0C447C}.t-sa{background:#FAEEDA;color:#633806}
.t-ri{background:#E8F5E9;color:#1B5E20}.t-sh{background:#FBEAF0;color:#72243E}
.t-so{background:#EEEDFE;color:#3C3489}.t-ta{background:#E1F5EE;color:#085041}
.t-gi{background:#FAECE7;color:#4A1B0C}.t-gray{background:var(--surface2);color:var(--text2)}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);animation:fadeUp .3s ease}
.rcard.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.rcard.clickable:hover{box-shadow:var(--shadow),0 0 0 2px var(--accent);border-color:var(--accent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pbar{height:5px;background:var(--surface2);border-radius:4px;margin:6px 0;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.score-circle{width:52px;height:52px;border-radius:50%;border:2.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-box.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.stat-box.clickable:hover{box-shadow:var(--shadow),0 0 0 2px var(--accent);border-color:var(--accent)}
.stat-num{font-size:24px;font-weight:700}.stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.map-subj{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.map-head{padding:9px 12px;font-size:12px;font-weight:700}
.map-body{padding:6px 10px 10px}
.map-unit{font-size:11px;padding:4px 8px;border-radius:6px;margin-bottom:4px;display:flex;align-items:center;gap:6px;color:var(--text2);background:var(--bg);line-height:1.3;position:relative;overflow:hidden}
.map-unit.touch{color:#27500A;font-weight:500;background:#F0FAE8;cursor:pointer;transition:opacity .15s}
.map-unit.partial{color:#1D5221;font-weight:500;background:#C8EDBE;cursor:pointer;transition:opacity .15s}
.map-unit.done{color:#fff;font-weight:700;background:#2C5F2E;cursor:pointer;transition:opacity .15s}
.map-unit.touch:hover,.map-unit.partial:hover,.map-unit.done:hover{opacity:.8}
/* スコアバー（単元の下部） */
.unit-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 2px 2px 0;transition:width .6s ease;background:#639922}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-on{background:#fff}.dot-partial{background:#4A9B3A}.dot-touch{background:#8DC872}.dot-off{background:var(--border)}
.banner{padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;margin-top:12px;display:none;line-height:1.5}
.banner-ok{background:var(--accent-l);color:var(--accent)}
.banner-err{background:var(--danger-l);color:var(--danger);font-size:12px;line-height:1.6}
.lv-A{background:var(--accent-l);color:var(--accent);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.lv-B{background:var(--warn-l);color:var(--warn);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.lv-C{background:var(--danger-l);color:var(--danger);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.auto-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px dashed var(--border)}
.apibox{background:var(--warn-l);border:1px solid #F3D08A;border-radius:var(--radius-sm);padding:16px;margin-bottom:16px}
.apibox p{font-size:13px;color:var(--warn);margin-bottom:8px;line-height:1.8}
.apibox a{color:var(--warn);font-weight:500}
.apibox input{width:100%;border:1px solid #F3D08A;border-radius:6px;padding:9px 12px;font-size:13px;font-family:'DM Mono',monospace;background:#fff;color:var(--text)}
.apibox input:focus{outline:none;border-color:var(--warn)}
.save-btn{margin-top:8px;padding:7px 18px;background:var(--warn);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:500}
.sec-title{font-size:12px;color:var(--text2);margin-bottom:10px;font-weight:500}
.empty-state{text-align:center;padding:48px 20px;color:var(--text2);font-size:13px;line-height:1.8}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px}
.header-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.hbtn{padding:5px 12px;font-size:12px;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--surface);color:var(--text2);font-family:'Noto Sans JP',sans-serif;white-space:nowrap;transition:all .15s}
.hbtn:hover{border-color:var(--text2);color:var(--text)}
.hbtn.import{background:#EAF3DE;border-color:#A8D5A2;color:#2C5F2E}
.hbtn.export{background:#F0EDE6}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-close{float:right;background:var(--surface2);border:none;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;color:var(--text2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;padding-right:60px;line-height:1.4}
.report-full{font-size:14px;line-height:1.9;color:var(--text);white-space:pre-wrap;background:var(--bg);padding:14px;border-radius:var(--radius-sm);margin-bottom:14px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">まなび<span>マップ</span><span class="logo-sub">学習指導要領 × AI採点</span></div>
  <div class="header-actions">
    <button class="hbtn import" onclick="importData()">📂 インポート</button>
    <button class="hbtn export" onclick="exportData()">💾 エクスポート</button>
  </div>
</div>
<input type="file" id="import-file" accept=".json" style="display:none" onchange="onImportFile(this)">
<div class="tabs">
  <button class="tab active" onclick="sw('submit')">📝 レポート提出</button>
  <button class="tab" onclick="sw('map')">🗺️ 学習マップ</button>
  <button class="tab" onclick="sw('history')">📚 履歴</button>
  <button class="tab" onclick="sw('teacher')">👩‍🏫 先生ダッシュ</button>
</div>

<!-- モーダル -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-body">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModalDirect()">閉じる</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- 提出 -->
<div class="page active" id="page-submit">
  <div class="apibox" id="loginbox">
    <p>🔑 <strong>クラスコードを入力してはじめよう</strong></p>
    <input type="text" id="code-input" placeholder="クラスコードを入力..." style="font-family:inherit">
    <button class="save-btn" onclick="verifyCode()">入室する</button>
    <div id="code-error" style="color:#8B1A1A;font-size:12px;margin-top:6px;display:none">クラスコードが正しくありません</div>
  </div>
  <div class="card">
    <label>生徒を選択</label>
    <div class="user-row" id="user-row"></div>
  </div>
  <div class="card">
    <label>学年 <span class="opt">— えらばなくてもOK！AIが内容から推測します</span></label>
    <div class="grade-row">
      <button class="gbtn" onclick="selG(this,'小1')">小1</button><button class="gbtn" onclick="selG(this,'小2')">小2</button>
      <button class="gbtn" onclick="selG(this,'小3')">小3</button><button class="gbtn" onclick="selG(this,'小4')">小4</button>
      <button class="gbtn" onclick="selG(this,'小5')">小5</button><button class="gbtn" onclick="selG(this,'小6')">小6</button>
      <button class="gbtn" onclick="selG(this,'中1')">中1</button><button class="gbtn" onclick="selG(this,'中2')">中2</button>
      <button class="gbtn" onclick="selG(this,'中3')">中3</button><button class="gbtn" onclick="selG(this,'高1')">高1</button>
      <button class="gbtn" onclick="selG(this,'高2')">高2</button><button class="gbtn" onclick="selG(this,'高3')">高3</button>
    </div>
  </div>
  <div class="card">
    <label>レポートを書いてね <span class="opt">— どんなトピックでもOK！</span></label>
    <textarea id="report-text" placeholder="きょうやったこと、気になったこと、調べたこと…なんでも書いてみよう！"></textarea>
  </div>
  <button class="btn-primary" id="submit-btn" onclick="submitReport()">
    <span id="btn-label">✨ AIにみてもらう！</span>
  </button>
  <div class="banner banner-ok" id="ok-banner"></div>
  <div class="banner banner-err" id="err-banner"></div>
  <div id="result-area"></div>
</div>

<!-- 学習マップ -->
<div class="page" id="page-map">
  <div class="card"><label>表示する生徒</label><div class="user-row" id="map-user-row"></div></div>
  <div class="stat-grid">
    <div class="stat-box clickable" onclick="mapStatClick('reports')" title="クリックで履歴へ">
      <div class="stat-num" id="s-rep">0</div><div class="stat-lbl">提出レポート 📋</div>
    </div>
    <div class="stat-box clickable" onclick="mapStatClick('units')" title="クリックで到達単元一覧へ">
      <div class="stat-num" id="s-unit">0</div><div class="stat-lbl">到達単元 ⭐</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="s-avg">-</div><div class="stat-lbl">平均スコア</div>
    </div>
  </div>
  <div class="map-grid" id="map-grid"></div>
</div>

<!-- 履歴 -->
<div class="page" id="page-history">
  <div class="card"><label>表示する生徒</label><div class="user-row" id="hist-user-row"></div></div>
  <div id="history-list"></div>
</div>

<!-- 先生ダッシュ -->
<div class="page" id="page-teacher">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-num" id="t-stu">0</div><div class="stat-lbl">登録生徒数</div></div>
    <div class="stat-box"><div class="stat-num" id="t-rep">0</div><div class="stat-lbl">総レポート数</div></div>
    <div class="stat-box"><div class="stat-num" id="t-unit">0</div><div class="stat-lbl">総到達単元</div></div>
  </div>
  <div class="dash-grid" id="teacher-cards"></div>
  <div class="card">
    <div class="sec-title">教科別カバー率（全生徒平均）</div>
    <div id="subject-bars"></div>
  </div>
</div>

<script>
const SUBJECTS={
  '国語':{cls:'t-ko',hdr:'background:#E6F1FB;color:#0C447C',units:['物語・読解','説明文・要約','漢字・語彙','書く力','話す・聞く']},
  '算数・数学':{cls:'t-sa',hdr:'background:#FAEEDA;color:#633806',units:['数と計算','図形','測定・量','関数・グラフ','統計・データ']},
  '理科':{cls:'t-ri',hdr:'background:#E8F5E9;color:#1B5E20',units:['生命・生物','物質・化学','エネルギー','地球・自然','科学的思考']},
  '社会':{cls:'t-sh',hdr:'background:#FBEAF0;color:#72243E',units:['地理','歴史','公民・政治','産業・経済','国際・文化']},
  '総合・探究':{cls:'t-so',hdr:'background:#EEEDFE;color:#3C3489',units:['課題発見','情報収集','まとめ・表現','協働学習','振り返り']},
  '体育・保健':{cls:'t-ta',hdr:'background:#E1F5EE;color:#085041',units:['体の仕組み','運動・スポーツ','健康・安全','心の健康','自然との関わり']},
  '技術・情報':{cls:'t-gi',hdr:'background:#FAECE7;color:#4A1B0C',units:['情報技術','デジタル・AI','ものづくり','データ活用','問題解決']},
};
const ACOLORS=['#E6F1FB','#EAF3DE','#FAEEDA','#EEEDFE','#FAECE7','#E1F5EE','#FBEAF0'];
const ATEXTS=['#0C447C','#27500A','#633806','#3C3489','#4A1B0C','#085041','#72243E'];
let state={users:[],curUser:null,curGrade:'',reports:{},unlocked:{}};
let classCode='';

/* ── Storage ── */
function load(){
  try{const s=JSON.parse(localStorage.getItem('manabimap')||'{}');state.users=s.users||[];state.reports=s.reports||{};state.unlocked=s.unlocked||{};}catch(e){}
  const savedCode=localStorage.getItem('manabimap-code')||'';
  if(savedCode){classCode=savedCode;document.getElementById('loginbox').style.display='none';}
  if(!state.users.length)state.users=[{id:'u1',name:'生徒A'}];
  state.curUser=state.users[0].id;
  renderAll();
}
function save(){localStorage.setItem('manabimap',JSON.stringify({users:state.users,reports:state.reports,unlocked:state.unlocked}));}

/* ── Export / Import ── */
function exportData(){
  const data={version:2,exportedAt:new Date().toISOString(),users:state.users,reports:state.reports,unlocked:state.unlocked};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toLocaleDateString('ja-JP').replace(/\//g,'-');
  a.href=url;a.download=`まなびマップ_${date}.json`;a.click();
  URL.revokeObjectURL(url);
}
function importData(){document.getElementById('import-file').click();}
function onImportFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.users||!data.reports)throw new Error('形式が正しくありません');
      const merge=confirm(`インポートしますか？\n\n既存のデータと統合します（同じIDのデータは上書きされます）。\n\n生徒数: ${data.users.length}人 / レポート数: ${Object.values(data.reports).reduce((s,v)=>s+v.length,0)}件`);
      if(!merge)return;
      // ユーザーを統合（IDが被らなければ追加）
      data.users.forEach(u=>{if(!state.users.find(x=>x.id===u.id))state.users.push(u);});
      // レポートを統合
      Object.entries(data.reports).forEach(([uid,reps])=>{
        if(!state.reports[uid])state.reports[uid]=[];
        reps.forEach(r=>{if(!state.reports[uid].find(x=>x.id===r.id))state.reports[uid].unshift(r);});
        state.reports[uid].sort((a,b)=>new Date(b.date)-new Date(a.date));
      });
      // 到達記録を統合
      Object.entries(data.unlocked||{}).forEach(([uid,subjMap])=>{
        if(!state.unlocked[uid])state.unlocked[uid]={};
        Object.entries(subjMap).forEach(([subj,unitMap])=>{
          if(!state.unlocked[uid][subj])state.unlocked[uid][subj]={};
          Object.entries(unitMap).forEach(([unit,records])=>{
            if(!state.unlocked[uid][subj][unit])state.unlocked[uid][subj][unit]=[];
            records.forEach(rec=>{if(!state.unlocked[uid][subj][unit].find(x=>x.rid===rec.rid))state.unlocked[uid][subj][unit].push(rec);});
          });
        });
      });
      save();renderAll();
      alert(`✅ インポート完了！\n生徒数: ${state.users.length}人`);
    }catch(err){alert('❌ インポート失敗：'+err.message);}
    input.value='';
  };
  reader.readAsText(file);
}
async function verifyCode(){
  const code=document.getElementById('code-input').value.trim();
  if(!code)return;
  try{
    const res=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    const data=await res.json();
    if(data.ok){
      classCode=code;
      localStorage.setItem('manabimap-code',code);
      document.getElementById('loginbox').style.display='none';
      document.getElementById('code-error').style.display='none';
    }else{
      document.getElementById('code-error').style.display='block';
    }
  }catch(e){document.getElementById('code-error').style.display='block';}
}

/* ── Modal ── */
function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal-overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal-overlay').classList.remove('open');document.body.style.overflow='';}

/* ── Tabs ── */
function sw(t){
  ['submit','map','history','teacher'].forEach((n,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',n===t);
    document.getElementById('page-'+n).classList.toggle('active',n===t);
  });
  if(t==='map'){renderMap();renderUserRowIn('map-user-row',false);}
  if(t==='history'){renderHistory();renderUserRowIn('hist-user-row',false);}
  if(t==='teacher')renderTeacher();
}

/* ── Grade ── */
function selG(btn,g){
  if(btn.classList.contains('sel')){btn.classList.remove('sel');state.curGrade='';return;}
  document.querySelectorAll('.gbtn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');state.curGrade=g;
}

/* ── Users ── */
function renderAll(){renderUserRows();renderMap();renderHistory();renderTeacher();}
function renderUserRows(){['user-row','map-user-row','hist-user-row'].forEach((id,i)=>renderUserRowIn(id,i===0));}
function renderUserRowIn(id,addBtn){
  const el=document.getElementById(id);if(!el)return;
  let h='';
  state.users.forEach((u,i)=>{
    const bg=ACOLORS[i%ACOLORS.length],tc=ATEXTS[i%ATEXTS.length],sel=state.curUser===u.id;
    h+=`<button class="user-chip ${sel?'sel':''}" onclick="selUser('${u.id}','${id}')">
      <span class="avatar" style="background:${sel?'rgba(255,255,255,.25)':bg};color:${sel?'#fff':tc}">${u.name.slice(0,1)}</span>${u.name}
    </button>`;
  });
  if(addBtn)h+=`<button class="add-btn" onclick="addUser()">＋ 生徒を追加</button>`;
  el.innerHTML=h;
}
function selUser(uid,fromId){
  state.curUser=uid;renderUserRows();
  if(fromId==='map-user-row')renderMap();
  else if(fromId==='hist-user-row')renderHistory();
}
function addUser(){
  const name=prompt('生徒の名前を入力してください');
  if(!name||!name.trim())return;
  const id='u'+Date.now();
  state.users.push({id,name:name.trim()});state.curUser=id;renderUserRows();save();
}

/* ── Submit ── */
async function submitReport(){
  const text=document.getElementById('report-text').value.trim();
  if(!text){alert('レポートを書いてね！');return;}
  if(!classCode){alert('クラスコードを入力してください');return;}
  const btn=document.getElementById('submit-btn'),lbl=document.getElementById('btn-label');
  btn.disabled=true;lbl.innerHTML='<span class="spinner"></span> AIが分析中…';
  document.getElementById('ok-banner').style.display='none';
  document.getElementById('err-banner').style.display='none';
  document.getElementById('result-area').innerHTML='';
  const user=state.users.find(u=>u.id===state.curUser)||{name:'生徒'};
  const gradeInfo=state.curGrade||'不明（内容から推定してください）';
  const subjList=Object.keys(SUBJECTS).join('/');
  const unitList=Object.values(SUBJECTS).flatMap(s=>s.units).join('/');
  const prompt=`あなたは日本の学習指導要領の専門家であり、経験豊かな教育者です。以下の生徒のレポートを丁寧に分析し、JSONのみを返してください。前置き・説明・コードブロックは一切不要です。

生徒: ${user.name}　学年: ${gradeInfo}
レポート:「${text}」

【分析の指示】
1. このレポートに関係する教科・単元を複数（2〜4個）、教科横断的な視点で見つけてください
2. 学年が不明な場合は語彙・論理展開・知識量から推定してください
3. feedbackは以下の3つのパートを必ず含めてください：
   - 「◎ よかった点：」具体的にどの表現・内容・思考が優れているか（2〜3文）
   - 「△ もっとよくなるポイント：」何を加えると深まるか、具体的な改善案（2〜3文）
   - 「→ 次のチャレンジ：」この学びをさらに発展させるための問いや活動の提案（1〜2文）
4. overall_commentは生徒を励ます温かい言葉で始め、このレポート全体の価値と今後の可能性を述べてください（4〜5文）

{"estimated_grade":"推定学年（例:小5、中2など）","grade_reason":"推定根拠（学年指定時は空文字）","mappings":[{"subject":"${subjList}のいずれか","unit":"${unitList}のいずれか","curriculum_reference":"学習指導要領の該当箇所（1文、具体的な章・節も含める）","score":0から100の整数,"level":"A/B/C","feedback":"◎ よかった点：〜。△ もっとよくなるポイント：〜。→ 次のチャレンジ：〜。"}],"overall_comment":"生徒を励ます総合コメント（4〜5文）"}`;
  try{
    const res=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,code:classCode})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`);}
    const data=await res.json();
    const raw=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    let parsed=null;
    try{parsed=JSON.parse(raw.replace(/```json\s*|```\s*/g,'').trim());}catch(e1){
      try{const m=raw.match(/\{[\s\S]*"mappings"[\s\S]*\}/);if(m)parsed=JSON.parse(m[0]);}catch(e2){
        try{const s=raw.indexOf('{'),e=raw.lastIndexOf('}');if(s!==-1&&e!==-1)parsed=JSON.parse(raw.slice(s,e+1));}catch(e3){throw new Error('JSONの解析に失敗しました。もう一度試してください。');}
      }
    }
    if(!parsed?.mappings?.length)throw new Error('分析結果が空です。もう一度試してください。');
    const uid=state.curUser;
    if(!state.reports[uid])state.reports[uid]=[];
    if(!state.unlocked[uid])state.unlocked[uid]={};
    const grade=state.curGrade||parsed.estimated_grade||'';
    const rid='r'+Date.now();
    // 到達記録に学年・レポートIDも保存
    parsed.mappings.forEach(m=>{
      if(!state.unlocked[uid][m.subject])state.unlocked[uid][m.subject]={};
      if(!state.unlocked[uid][m.subject][m.unit])state.unlocked[uid][m.subject][m.unit]=[];
      state.unlocked[uid][m.subject][m.unit].push({rid,grade,date:new Date().toISOString(),feedback:m.feedback,curriculum_reference:m.curriculum_reference,score:m.score,level:m.level});
    });
    state.reports[uid].unshift({id:rid,grade,gradeAuto:!state.curGrade,text,result:parsed,date:new Date().toISOString()});
    save();
    document.getElementById('report-text').value='';
    const okEl=document.getElementById('ok-banner');
    okEl.textContent=`🎉 できた！${parsed.mappings.length}つの教科・単元がみつかったよ。「学習マップ」タブも見てみよう！`;
    okEl.style.display='block';
    renderResult(parsed);
  }catch(e){
    const el=document.getElementById('err-banner');
    el.textContent='❌ エラー：'+e.message;
    el.style.display='block';
  }finally{
    btn.disabled=false;lbl.textContent='✨ AIにみてもらう！';
  }
}

/* ── Render result (submit tab) ── */
function formatFeedback(fb){
  // ◎ △ → の3パートを見やすく整形
  return fb
    .replace(/◎\s*よかった点[：:]/g,'<div style="margin-bottom:8px"><span style="display:inline-block;background:#EAF3DE;color:#2C5F2E;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:4px">◎ よかった点</span><br>')
    .replace(/△\s*もっとよくなるポイント[：:]/g,'</div><div style="margin-bottom:8px"><span style="display:inline-block;background:#FEF3E2;color:#A85A00;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:4px">△ もっとよくなるポイント</span><br>')
    .replace(/→\s*次のチャレンジ[：:]/g,'</div><div style="margin-bottom:4px"><span style="display:inline-block;background:#E6F1FB;color:#0C447C;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:4px">→ 次のチャレンジ</span><br>')
    + '</div>';
}
function renderResult(parsed){
  let h='<div style="margin-top:16px">';
  if(parsed.estimated_grade&&parsed.grade_reason){
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 14px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:var(--surface)">
      <span class="auto-badge">AIが推定</span>
      <span style="font-size:13px;font-weight:700">${parsed.estimated_grade}</span>
      <span style="font-size:12px;color:var(--text2)">— ${parsed.grade_reason}</span>
    </div>`;
  }
  h+=`<div style="padding:12px 16px;background:var(--surface2);border-radius:var(--radius-sm);font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.8;border-left:3px solid var(--accent)">${parsed.overall_comment}</div>`;
  h+=`<div class="sec-title">みつかった教科・単元（${parsed.mappings.length}こ）</div>`;
  parsed.mappings.forEach(m=>{
    const subj=SUBJECTS[m.subject]||{cls:'t-gray'};
    const sc=m.score>=80?'var(--accent)':m.score>=60?'var(--warn)':'var(--danger)';
    h+=`<div class="rcard">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px">
        <div style="flex:1">
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
            <span class="tag ${subj.cls}">${m.subject}</span>
            <span class="tag t-gray">${m.unit}</span>
            <span class="lv-${m.level}">Lv.${m.level}</span>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px;line-height:1.5">${m.curriculum_reference}</div>
          <div class="pbar"><div class="pbar-fill" style="width:${m.score}%;background:${sc}"></div></div>
        </div>
        <div class="score-circle" style="border-color:${sc}">
          <span style="font-size:17px;font-weight:700;color:${sc};line-height:1">${m.score}</span>
          <span style="font-size:9px;color:var(--text3)">点</span>
        </div>
      </div>
      <div style="font-size:13px;color:var(--text2);line-height:1.8;padding-top:10px;border-top:1px solid var(--border)">${formatFeedback(m.feedback)}</div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('result-area').innerHTML=h;
}

/* ── Map ── */
function renderMap(){
  const uid=state.curUser;
  const reps=state.reports[uid]||[];
  const unlk=state.unlocked[uid]||{};
  // 単元数カウント（新形式・旧形式両対応）
  let totalUnits=0;
  Object.values(unlk).forEach(subj=>{
    if(typeof subj==='object'&&!Array.isArray(subj))totalUnits+=Object.keys(subj).length;
  });
  const scores=reps.flatMap(r=>r.result.mappings.map(m=>m.score));
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b)/scores.length):null;
  document.getElementById('s-rep').textContent=reps.length;
  document.getElementById('s-unit').textContent=totalUnits;
  document.getElementById('s-avg').textContent=avg!==null?avg+'点':'-';
  const grid=document.getElementById('map-grid');
  if(!reps.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1">まだレポートがありません</div>';return;}
  let h='';
  Object.entries(SUBJECTS).forEach(([subj,conf])=>{
    const subjData=unlk[subj]||{};
    const doneUnits=typeof subjData==='object'&&!Array.isArray(subjData)?Object.keys(subjData):[];
    h+=`<div class="map-subj">
      <div class="map-head" style="${conf.hdr}">${subj} <span style="font-weight:400;opacity:.7">${doneUnits.length}/${conf.units.length}</span></div>
      <div class="map-body">`;
    conf.units.forEach(u=>{
      if(doneUnits.includes(u)){
        // スコアの平均を計算してグラデーション段階を決定
        const records=subjData[u]||[];
        const avgScore=records.length?Math.round(records.reduce((s,r)=>s+r.score,0)/records.length):0;
        // 80以上→done(濃緑), 60〜79→partial(中緑), 1〜59→touch(薄緑)
        const cls=avgScore>=80?'done':avgScore>=60?'partial':'touch';
        const dotCls=avgScore>=80?'dot-on':avgScore>=60?'dot-partial':'dot-touch';
        const barW=Math.min(100,avgScore);
        h+=`<div class="map-unit ${cls}" onclick="showUnitDetail('${uid}','${subj}','${u}')">
          <span class="dot ${dotCls}"></span><span style="flex:1">${u}</span><span style="font-size:10px;opacity:.8">${avgScore}点</span>
          <span class="unit-bar" style="width:${barW}%"></span>
        </div>`;
      }else{
        h+=`<div class="map-unit"><span class="dot dot-off"></span>${u}</div>`;
      }
    });
    h+='</div></div>';
  });
  grid.innerHTML=h;
}

/* ① 提出レポート数 or ② 到達単元数をクリック */
function mapStatClick(type){
  const uid=state.curUser;
  if(type==='reports'){
    // 履歴タブへ移動
    sw('history');
  } else if(type==='units'){
    // 到達単元一覧モーダル
    const unlk=state.unlocked[uid]||{};
    let h=`<div class="modal-title">⭐ 到達した単元一覧</div>`;
    let any=false;
    Object.entries(SUBJECTS).forEach(([subj,conf])=>{
      const subjData=unlk[subj]||{};
      const doneUnits=typeof subjData==='object'&&!Array.isArray(subjData)?Object.keys(subjData):[];
      if(!doneUnits.length)return;
      any=true;
      h+=`<div style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:700;margin-bottom:6px;padding:4px 10px;border-radius:20px;display:inline-block" class="tag ${conf.cls}">${subj}</div>
        <div>`;
      doneUnits.forEach(u=>{
        const records=subjData[u]||[];
        const latestGrade=records.length?records[records.length-1].grade:'';
        const latestScore=records.length?records[records.length-1].score:'-';
        h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--accent-l);border-radius:6px;margin-bottom:4px;cursor:pointer" onclick="showUnitDetail('${uid}','${subj}','${u}')">
          <span style="font-size:13px;font-weight:500">${u}</span>
          <span style="font-size:11px;color:var(--text2)">${latestGrade} / ${latestScore}点</span>
        </div>`;
      });
      h+='</div></div>';
    });
    if(!any)h+='<div class="empty-state">まだ到達した単元がありません</div>';
    openModal(h);
  }
}

/* ④ 単元をクリック → どのレポートで到達したか */
function showUnitDetail(uid,subj,unit){
  const unlk=state.unlocked[uid]||{};
  const records=(unlk[subj]&&unlk[subj][unit])||[];
  const conf=SUBJECTS[subj]||{cls:'t-gray'};
  let h=`<div class="modal-title"><span class="tag ${conf.cls}">${subj}</span> ＞ ${unit}</div>`;
  if(!records.length){h+='<div class="empty-state">記録がありません</div>';openModal(h);return;}
  h+=`<div style="font-size:12px;color:var(--text2);margin-bottom:12px">この単元に到達したレポート（${records.length}件）</div>`;
  records.slice().reverse().forEach(rec=>{
    const rep=(state.reports[uid]||[]).find(r=>r.id===rec.rid);
    const d=new Date(rec.date).toLocaleDateString('ja-JP');
    const sc=rec.score>=80?'var(--accent)':rec.score>=60?'var(--warn)':'var(--danger)';
    h+=`<div class="rcard" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <span style="font-size:12px;color:var(--text3)">${rec.grade||'学年不明'} — ${d}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="lv-${rec.level}">Lv.${rec.level}</span>
          <span style="font-size:16px;font-weight:700;color:${sc}">${rec.score}点</span>
        </div>
      </div>
      ${rep?`<div style="font-size:13px;color:var(--text2);background:var(--bg);padding:8px 10px;border-radius:6px;margin-bottom:8px;line-height:1.6;cursor:pointer" onclick="showReportDetail('${uid}','${rep.id}')">"${rep.text.slice(0,60)}${rep.text.length>60?'…':''}"<span style="font-size:11px;color:var(--accent);margin-left:4px">全文を読む →</span></div>`:''}
      <div style="font-size:12px;color:var(--text3);margin-bottom:4px">${rec.curriculum_reference}</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.7;padding-top:8px;border-top:1px solid var(--border)">${formatFeedback(rec.feedback)}</div>
    </div>`;
  });
  openModal(h);
}

/* ── Teacher ── */
function renderTeacher(){
  document.getElementById('t-stu').textContent=state.users.length;
  document.getElementById('t-rep').textContent=Object.values(state.reports).reduce((s,v)=>s+v.length,0);
  let totalU=0;
  Object.values(state.unlocked).forEach(u=>Object.values(u).forEach(subj=>{if(typeof subj==='object'&&!Array.isArray(subj))totalU+=Object.keys(subj).length;}));
  document.getElementById('t-unit').textContent=totalU;
  let cards='';
  state.users.forEach((u,i)=>{
    const bg=ACOLORS[i%ACOLORS.length],tc=ATEXTS[i%ATEXTS.length];
    const reps=state.reports[u.id]||[];
    const unlk=state.unlocked[u.id]||{};
    let unitCnt=0;
    Object.values(unlk).forEach(subj=>{if(typeof subj==='object'&&!Array.isArray(subj))unitCnt+=Object.keys(subj).length;});
    const scores=reps.flatMap(r=>r.result.mappings.map(m=>m.score));
    const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b)/scores.length):null;
    cards+=`<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div class="avatar" style="width:38px;height:38px;font-size:15px;font-weight:700;background:${bg};color:${tc}">${u.name.slice(0,1)}</div>
        <div style="font-size:15px;font-weight:700">${u.name}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[['レポート',reps.length,'📝'],['到達単元',unitCnt,'⭐'],['平均スコア',avg!==null?avg+'点':'-','📊'],['教科数',Object.keys(unlk).length,'📚']].map(([l,v,e])=>`
          <div style="background:var(--bg);border-radius:var(--radius-sm);padding:10px;text-align:center">
            <div style="font-size:18px;margin-bottom:2px">${e}</div>
            <div style="font-size:17px;font-weight:700">${v}</div>
            <div style="font-size:10px;color:var(--text2)">${l}</div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('teacher-cards').innerHTML=cards||'<div class="empty-state">生徒が登録されていません</div>';
  let bars='';
  Object.entries(SUBJECTS).forEach(([subj,conf])=>{
    let total=state.users.length*conf.units.length,done=0;
    state.users.forEach(u=>{
      const sd=state.unlocked[u.id]&&state.unlocked[u.id][subj];
      if(sd&&typeof sd==='object'&&!Array.isArray(sd))done+=Object.keys(sd).length;
    });
    const pct=total>0?Math.round(done/total*100):0;
    bars+=`<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span class="tag ${conf.cls}">${subj}</span>
        <span style="font-size:12px;color:var(--text2);font-family:'DM Mono',monospace">${pct}%</span>
      </div>
      <div class="pbar" style="height:6px"><div class="pbar-fill" style="width:${pct}%;background:var(--accent)"></div></div>
    </div>`;
  });
  document.getElementById('subject-bars').innerHTML=bars;
}

load();
</script>
</body>
</html>
